# Einstellungen für Netlify: wie die Website gebaut und veröffentlicht wird.
[build]
  command = "npm run build"
  publish = "dist"

# Astro braucht Node.js 22.23 oder neuer; 24 ist die aktuelle Langzeitversion
[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# Das Dashboard soll nicht in Suchmaschinen erscheinen
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Bilder dürfen nie Skripte ausführen, auch nicht eine SVG-Datei, die direkt geöffnet wird
[[headers]]
  for = "/bilder/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox"
    X-Content-Type-Options = "nosniff"
