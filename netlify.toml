# Einstellungen für Netlify: wie die Website gebaut und veröffentlicht wird.
[build]
  command = "npm run build"
  publish = "dist"

# Astro braucht Node.js 22.23 oder neuer; 24 ist die aktuelle Langzeitversion
[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# Das Dashboard soll nicht in Suchmaschinen erscheinen
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
